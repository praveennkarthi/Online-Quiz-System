{% extends "quiz/base.html" %}
{% block content %}
<h1>My Results</h1>
<div class="card">
  <table>
    <tr><th>Quiz</th><th>Score</th><th>Date</th><th></th></tr>
    {% for a in attempts %}
      <tr>
        <td>{{ a.quiz.title }}</td>
        <td>{{ a.score }}/{{ a.total }} ({{ a.percentage }}%)</td>
        <td>{{ a.taken_at|date:"d M Y, H:i" }}</td>
        <td><a href="{% url 'result' a.id %}">View</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="4" class="muted">You haven't attempted any quiz yet.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
