{% extends "quiz/base.html" %}
{% block content %}
<h1>{{ quiz.title }} - Leaderboard</h1>
<div class="card">
  <table>
    <tr><th>#</th><th>User</th><th>Best score</th></tr>
    {% for r in rows %}
      <tr><td>{{ forloop.counter }}</td><td>{{ r.user__username }}</td><td>{{ r.best }}</td></tr>
    {% empty %}
      <tr><td colspan="3" class="muted">No attempts yet.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
